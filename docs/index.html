<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Desempeño - FACS - UNEMI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Encabezado fijo: el logo y los filtros quedan siempre a la vista -->
<header class="appbar">
  <img class="appbar-logo" src="img/logo-vicerrectorado.png"
       alt="UNEMI - Vicerrectorado Académico de Formación de Grado">
  <div class="appbar-titulo">
    <h1>Dashboard de Desempeño de la Carrera</h1>
    <p>Facultad de Ciencias de la Salud</p>
  </div>
  <div class="filters">
    <div class="fld"><label for="fCarrera">Carrera</label>
      <select id="fCarrera">
        <option value="FACS">Toda la facultad</option>
        <option value="ENF">Enfermería</option>
        <option value="NUT">Nutrición y Dietética</option>
      </select></div>
    <div class="fld"><label for="fModalidad">Modalidad</label>
      <select id="fModalidad" disabled><option>Presencial</option></select></div>
    <div class="fld"><label for="fNivel">Nivel</label><select id="fNivel"></select></div>
    <div class="fld"><label for="fAnio">Periodo</label><select id="fAnio"></select></div>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <nav aria-label="Vistas del dashboard"><ul class="nav" id="nav"></ul></nav>
  </aside>
  <main class="main">
    <div class="body" id="vista"></div>
  </main>
</div>

<footer class="sitefooter">
  <img src="img/logo-dipa-blanco.png" alt="DIPA - Dirección de Innovación de Procesos Académicos">
</footer>

<div class="tip" id="tip" role="tooltip"></div>

<script src="data/indicadores.js"></script>
<script src="data/facs-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
